# Optional Home Assistant Automation: Order Alert & Notification
#
# NOTE: The ESP32 display firmware ALREADY has automatic fireworks animation
# built directly into its code whenever total orders increments!
#
# This automation is OPTIONAL and useful if you want Home Assistant to:
#  1. Send push notifications with customer & order details to your phone.
#  2. Trigger other smart home devices (e.g. RGB room lights, chimes).
#  3. Remotely trigger the display fireworks via service call.

alias: "WooCommerce - New Order Notification & Alert"
description: "Detects when total orders increment and sends a notification with order details."
trigger:
  - platform: state
    entity_id: sensor.<your_store>_total_orders
condition:
  # Ensure both states are numeric and order count increased
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and
         trigger.to_state is not none and
         trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}
action:
  # 1. Send persistent notification (or notify.mobile_app_<your_phone>)
  - service: notify.persistent_notification
    data:
      title: "🎉 New Order Received!"
      message: >
        Order {{ states('sensor.<your_store>_latest_order') }}
        Customer: {{ state_attr('sensor.<your_store>_latest_order', 'customer_name') }}
        Amount: {{ state_attr('sensor.<your_store>_latest_order', 'total') }} {{ state_attr('sensor.<your_store>_latest_order', 'currency') }}

  # 2. Optional: Explicitly trigger the display fireworks if not already triggered
  - service: esphome.woocommerce_display_trigger_fireworks
    data: {}
mode: single
