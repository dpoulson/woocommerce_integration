# ESPHome Configuration for WooCommerce Order Display & Fireworks Animation
# Target Hardware: GeekMagic SmallTV / SmallTV Ultra (ESP8266 / ESP-12F with 1.54" 240x240 ST7789 IPS LCD & Top Button)

substitutions:
  device_name: "woocommerce-geekmagic"
  friendly_name: "WooCommerce GeekMagic Display"
  ha_orders_processing_sensor: "sensor.we_make_things_co_uk_orders_processing"
  ha_orders_failed_sensor: "sensor.we_make_things_co_uk_orders_failed"
  ha_order_count_sensor: "sensor.we_make_things_co_uk_total_orders"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100.0
    then:
      - light.turn_on:
          id: back_light
          brightness: 100%

esp8266:
  board: esp12e
  framework:
    version: recommended

# Home Assistant native API connection
api:
  services:
    - service: trigger_fireworks
      then:
        - lambda: |-
            id(fireworks_active) = true;
            id(fireworks_timer) = 0;
            id(burst_x) = 60 + (rand() % 120);
            id(burst_y) = 60 + (rand() % 120);

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WooCommerce-GeekMagic-Hotspot"
    password: !secret ap_fallback_password

captive_portal:

logger:
  baud_rate: 115200

# Home Assistant Connection Status & Hardware Button
binary_sensor:
  - platform: status
    id: ha_connected

  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: top_button
    name: "Top Button"
    on_press:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: ${ha_orders_processing_sensor}
      - lambda: |-
          id(touch_feedback) = true;
          id(touch_feedback_timer) = 5;

# SPI Bus for ST7789 Display (ESP8266 Hardware SPI: CLK=GPIO14, MOSI=GPIO13)
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  id: spibus

# Backlight Output (GPIO5 PWM on ESP8266 GeekMagic)
output:
  - platform: esp8266_pwm
    pin: GPIO5
    frequency: 1000Hz
    inverted: true
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

# Typography
font:
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 12
  - file: "gfonts://Roboto"
    id: font_small
    size: 15
  - file: "gfonts://Roboto"
    id: font_medium
    size: 18
  - file: "gfonts://Roboto"
    id: font_massive
    size: 72

# State tracking for animations, transitions & touch
globals:
  - id: prev_orders
    type: int
    restore_value: no
    initial_value: '0'
  - id: fireworks_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: fireworks_timer
    type: int
    restore_value: no
    initial_value: '0'
  - id: burst_x
    type: int
    restore_value: no
    initial_value: '120'
  - id: burst_y
    type: int
    restore_value: no
    initial_value: '120'
  - id: touch_feedback
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: touch_feedback_timer
    type: int
    restore_value: no
    initial_value: '0'

# Sensors imported from Home Assistant
sensor:
  - platform: homeassistant
    id: orders_processing
    entity_id: ${ha_orders_processing_sensor}

  - platform: homeassistant
    id: orders_failed
    entity_id: ${ha_orders_failed_sensor}

  - platform: homeassistant
    id: order_count
    entity_id: ${ha_order_count_sensor}
    on_value:
      then:
        - lambda: |-
            int current = (int)x;
            if (id(prev_orders) > 0 && current > id(prev_orders)) {
              id(fireworks_active) = true;
              id(fireworks_timer) = 0;
              id(burst_x) = 60 + (rand() % 120);
              id(burst_y) = 60 + (rand() % 120);
            }
            id(prev_orders) = current;

# Colors Definition
color:
  - id: color_wc_purple
    red: 49%
    green: 33%
    blue: 70%
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
  - id: color_gold
    red: 100%
    green: 84%
    blue: 0%
  - id: color_bg
    red: 4%
    green: 4%
    blue: 7%
  - id: color_green
    red: 15%
    green: 85%
    blue: 40%
  - id: color_red
    red: 90%
    green: 20%
    blue: 20%
  - id: color_dim
    red: 40%
    green: 40%
    blue: 50%
  - id: color_card_bg
    red: 10%
    green: 10%
    blue: 15%

# 1.54" Square ST7789 IPS Display (240x240)
display:
  - platform: ili9xxx
    model: ST7789V
    spi_id: spibus
    data_rate: 20MHz
    dc_pin: GPIO0
    reset_pin: GPIO2
    spi_mode: MODE3
    invert_colors: true
    dimensions:
      height: 240
      width: 240
      offset_height: 0
      offset_width: 0
    update_interval: 100ms
    lambda: |-
      if (id(fireworks_active)) {
        // --- CELEBRATORY FIREWORKS DISPLAY (240x240 Square Screen) ---
        it.fill(id(color_bg));

        int t = id(fireworks_timer);
        int cx = id(burst_x);
        int cy = id(burst_y);

        // Multi-colored Particle Starburst (16 rays)
        const int ray_count = 16;
        float angle_step = 6.2831853 / ray_count;
        int max_r = (t < 18) ? (t * 6) : 95;

        for (int i = 0; i < ray_count; i++) {
          float angle = i * angle_step;
          int px1 = cx + (int)(cos(angle) * (max_r * 0.35));
          int py1 = cy + (int)(sin(angle) * (max_r * 0.35));
          int px2 = cx + (int)(cos(angle) * max_r);
          int py2 = cy + (int)(sin(angle) * max_r);

          Color ray_color = (i % 3 == 0) ? id(color_gold) : ((i % 3 == 1) ? id(color_white) : id(color_wc_purple));
          it.line(px1, py1, px2, py2, ray_color);
          it.filled_circle(px2, py2, 2, ray_color);
        }

        // Center Gold Burst
        it.filled_circle(cx, cy, (t < 10) ? (10 - t) : 2, id(color_gold));

        // Celebratory Center Banner
        it.filled_rectangle(15, 96, 210, 48, id(color_wc_purple));
        it.printf(120, 101, id(font_medium), id(color_gold), TextAlign::TOP_CENTER, "NEW ORDER!");
        it.printf(120, 125, id(font_small), id(color_white), TextAlign::TOP_CENTER, "Received");

        id(fireworks_timer)++;
        if (id(fireworks_timer) > 35) { // ~3.5 seconds
          id(fireworks_active) = false;
          id(fireworks_timer) = 0;
        }
      } else {
        // --- NORMAL LIVE STORE DASHBOARD (Orders Processing Centric) ---
        it.fill(id(color_bg));

        // Modern Card Frame (glows gold on button feedback)
        Color frame_color = id(color_wc_purple);
        if (id(touch_feedback)) {
          frame_color = id(color_gold);
          id(touch_feedback_timer)--;
          if (id(touch_feedback_timer) <= 0) {
            id(touch_feedback) = false;
          }
        }
        it.rectangle(4, 4, 232, 232, frame_color);
        it.rectangle(5, 5, 230, 230, frame_color);

        // Header Card Area
        it.filled_rectangle(6, 6, 228, 38, id(color_card_bg));

        // 1. TOP NOTIFICATION STATUS (WiFi & Home Assistant Connection)
        bool ha_ok = id(ha_connected).state;
        bool net_ok = network::is_connected();
        Color status_col = (ha_ok && net_ok) ? id(color_green) : (net_ok ? id(color_gold) : id(color_red));
        it.filled_circle(20, 25, 4, status_col);

        // 2. CATEGORY LABEL: "PROCESSING"
        it.printf(120, 16, id(font_medium), id(color_dim), TextAlign::TOP_CENTER, "PROCESSING");

        // 3. BULK OF DISPLAY: Orders Processing (0-99)
        int proc_count = 0;
        if (id(orders_processing).has_state()) {
          proc_count = (int)id(orders_processing).state;
          Color num_color = (proc_count > 0) ? id(color_gold) : id(color_white);
          it.printf(120, 68, id(font_massive), num_color, TextAlign::TOP_CENTER, "%d", proc_count);
        } else {
          it.printf(120, 68, id(font_massive), id(color_dim), TextAlign::TOP_CENTER, "--");
        }

        // 4. FOOTER STATUS / FAILED ORDERS ALERT
        if (id(orders_failed).has_state() && id(orders_failed).state > 0) {
          int failed_count = (int)id(orders_failed).state;
          it.filled_rectangle(12, 192, 216, 36, id(color_red));
          it.printf(120, 201, id(font_small), id(color_white), TextAlign::TOP_CENTER, "! %d Failed Orders", failed_count);
        } else {
          it.printf(120, 204, id(font_tiny), id(color_dim), TextAlign::TOP_CENTER, "Tap button to sync");
        }
      }
